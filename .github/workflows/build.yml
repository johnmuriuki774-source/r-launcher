name: Build Moon Terminal Launcher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Moon Terminal Launcher APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'


      # ============================================================
      # 3. CREATE PROJECT DIRECTORIES
      # ============================================================

      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/moon/terminal/ui
          mkdir -p app/src/main/java/com/moon/terminal/commands
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper

          echo "Project directories created."


      # ============================================================
      # 4. SETTINGS.GRADLE
      # ============================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Moon Terminal Launcher"

          include(":app")
          EOF


      # ============================================================
      # 5. ROOT BUILD.GRADLE
      # ============================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }

          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib:1.9.22",
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22",
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
                      )
                  }
              }
          }
          EOF


      # ============================================================
      # 6. APP BUILD.GRADLE
      # ============================================================

      - name: Create app/build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.moon.terminal'
              compileSdk 34

              defaultConfig {
                  applicationId "com.moon.terminal"
                  minSdk 24
                  targetSdk 34

                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.13.1'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'com.google.android.material:material:1.12.0'

              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }

          configurations.configureEach {
              resolutionStrategy {
                  force(
                      "org.jetbrains.kotlin:kotlin-stdlib:1.9.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
                  )
              }
          }
          EOF


      # ============================================================
      # 7. GRADLE PROPERTIES
      # ============================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

          kotlin.code.style=official
          EOF


      # ============================================================
      # 8. GRADLE WRAPPER
      # ============================================================

      - name: Create Gradle wrapper properties
        shell: bash
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF


      # ============================================================
      # 9. COLORS
      # ============================================================

      - name: Create colors.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <color name="moon_black">#050509</color>
              <color name="moon_background">#0A0A0F</color>
              <color name="moon_terminal">#0D0D18</color>

              <color name="moon_blue">#1793D1</color>
              <color name="moon_cyan">#00E5FF</color>
              <color name="moon_green">#2ECC71</color>

              <color name="moon_red">#FF3B30</color>
              <color name="moon_yellow">#FFD60A</color>

              <color name="moon_purple">#9B59B6</color>
              <color name="moon_white">#ECF0F1</color>
              <color name="moon_gray">#7F8C8D</color>

          </resources>
          EOF


      # ============================================================
      # 10. STRINGS
      # ============================================================

      - name: Create strings.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <string name="app_name">Moon Terminal Launcher</string>

          </resources>
          EOF


      # ============================================================
      # 11. THEME
      # ============================================================

      - name: Create themes.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.MoonTerminal"
                  parent="Theme.AppCompat.NoActionBar">

                  <item name="android:fontFamily">monospace</item>

                  <item name="android:windowFullscreen">true</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:windowBackground">
                      @color/moon_black
                  </item>

                  <item name="android:navigationBarColor">
                      @color/moon_black
                  </item>

                  <item name="android:statusBarColor">
                      @color/moon_black
                  </item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 12. ANDROID MANIFEST
      # ============================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MoonTerminal">

                  <activity
                      android:name=".ui.TerminalActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 13. TERMINAL LAYOUT
      # ============================================================

      - name: Create terminal layout
        shell: bash
        run: |
          cat > app/src/main/res/layout/activity_terminal.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:layout_width="match_parent"
              android:layout_height="match_parent"

              android:orientation="vertical"

              android:background="#0A0A0F">

              <ScrollView

                  android:id="@+id/terminal_scroll"

                  android:layout_width="match_parent"
                  android:layout_height="0dp"

                  android:layout_weight="1"

                  android:background="#0D0D18">

                  <TextView

                      android:id="@+id/terminal_output"

                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"

                      android:padding="10dp"

                      android:fontFamily="monospace"

                      android:textColor="#B8C7E0"

                      android:textSize="15sp"

                      android:lineSpacingExtra="3dp"/>

              </ScrollView>


              <LinearLayout

                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"

                  android:orientation="horizontal"

                  android:padding="5dp"

                  android:background="#15151F">

                  <TextView

                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"

                      android:text="moon@android:~$ "

                      android:textColor="#2ECC71"

                      android:fontFamily="monospace"

                      android:textSize="14sp"/>


                  <EditText

                      android:id="@+id/input_field"

                      android:layout_width="0dp"
                      android:layout_height="wrap_content"

                      android:layout_weight="1"

                      android:background="@android:color/transparent"

                      android:textColor="#ECF0F1"

                      android:textColorHint="#7F8C8D"

                      android:hint="command"

                      android:fontFamily="monospace"

                      android:textSize="14sp"

                      android:singleLine="true"

                      android:inputType="textNoSuggestions"/>

              </LinearLayout>


              <TextView

                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"

                  android:gravity="center"

                  android:padding="3dp"

                  android:text="🌙 MOON TERMINAL LAUNCHER"

                  android:textColor="#1793D1"

                  android:textSize="9sp"

                  android:fontFamily="monospace"/>

          </LinearLayout>
          EOF


      # ============================================================
      # 14. COMMAND REGISTRY
      # ============================================================

      - name: Create CommandRegistry.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/moon/terminal/commands/CommandRegistry.kt <<'EOF'
          package com.moon.terminal.commands

          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class CommandRegistry(
              private val context: Context
          ) {

              fun executeCommand(input: String): String {

                  val parts = input.trim()
                      .split(Regex("\\s+"))

                  if (parts.isEmpty()) {
                      return ""
                  }

                  val command = parts[0].lowercase()

                  val args =
                      if (parts.size > 1)
                          parts.drop(1)
                      else
                          emptyList()

                  return when (command) {

                      "help" ->
                          help()

                      "clear" ->
                          "CLEAR"

                      "date" ->
                          SimpleDateFormat(
                              "yyyy-MM-dd HH:mm:ss",
                              Locale.getDefault()
                          ).format(Date())

                      "time" ->
                          SimpleDateFormat(
                              "HH:mm:ss",
                              Locale.getDefault()
                          ).format(Date())

                      "whoami" ->
                          "moon"

                      "pwd" ->
                          "/home/moon"

                      "uname" ->
                          "Moon Linux aarch64"

                      "echo" ->
                          args.joinToString(" ")

                      "neofetch" ->
                          neofetch()

                      "sysinfo" ->
                          sysinfo()

                      "free" ->
                          memory()

                      "df" ->
                          storage()

                      "ls" ->
                          listFiles()

                      "cowsay" ->
                          cowsay(args.joinToString(" "))

                      "fortune" ->
                          fortune()

                      "banner" ->
                          banner(args.joinToString(" "))

                      "ascii" ->
                          ascii(args.firstOrNull())

                      "math" ->
                          calculate(args.joinToString(" "))

                      else ->
                          "moon: $command: command not found\nType 'help' for available commands."
                  }
              }


              private fun help(): String {

                  return """
          ╔══════════════════════════════════════╗
          ║       MOON TERMINAL COMMANDS         ║
          ╚══════════════════════════════════════╝

          SYSTEM
            neofetch     System information
            sysinfo      Device information
            free         Memory information
            df           Storage information
            date         Current date
            time         Current time

          FILES
            ls           List files
            pwd          Current directory
            cat          Read a file

          TERMINAL
            clear        Clear terminal
            echo         Print text
            whoami       Current user
            uname        System information

          FUN
            cowsay       ASCII cow
            fortune      Random message
            banner       Banner text
            ascii arch   Arch ASCII art
            ascii tux    Tux ASCII art

          UTILITY
            math 2+2      Calculator

          🌙 Moon Terminal Launcher
                  """.trimIndent()
              }


              private fun neofetch(): String {

                  val runtime = Runtime.getRuntime()

                  val total =
                      runtime.totalMemory() /
                          1024 /
                          1024

                  val free =
                      runtime.freeMemory() /
                          1024 /
                          1024

                  return """
                         .----.
                        / .--. \
                       / /    \ \
                       | |    | |
                       \ \    / /
                        '----'

          OS: Moon Linux
          Device: ${Build.MANUFACTURER} ${Build.MODEL}
          Android: ${Build.VERSION.RELEASE}
          API: ${Build.VERSION.SDK_INT}
          CPU: ${Build.SUPPORTED_ABIS.joinToString()}
          Memory: ${total - free}MB / ${total}MB

          🌙 Moon Terminal Launcher
                  """.trimIndent()
              }


              private fun sysinfo(): String {

                  return """
          System Information
          ─────────────────────────

          Manufacturer : ${Build.MANUFACTURER}
          Model        : ${Build.MODEL}
          Android      : ${Build.VERSION.RELEASE}
          API Level    : ${Build.VERSION.SDK_INT}
          CPU          : ${Build.SUPPORTED_ABIS.joinToString()}
          Board        : ${Build.BOARD}
          Device       : ${Build.DEVICE}
                  """.trimIndent()
              }


              private fun memory(): String {

                  val runtime =
                      Runtime.getRuntime()

                  val total =
                      runtime.totalMemory() /
                          1024 /
                          1024

                  val free =
                      runtime.freeMemory() /
                          1024 /
                          1024

                  val used =
                      total - free

                  return """
          Memory

          Used      : ${used} MB
          Free      : ${free} MB
          Allocated : ${total} MB
          Maximum   : ${runtime.maxMemory() / 1024 / 1024} MB
                  """.trimIndent()
              }


              private fun storage(): String {

                  return try {

                      val stat =
                          StatFs(
                              Environment
                                  .getDataDirectory()
                                  .path
                          )

                      val block =
                          stat.blockSizeLong

                      val total =
                          block *
                              stat.blockCountLong /
                              1024 /
                              1024 /
                              1024

                      val available =
                          block *
                              stat.availableBlocksLong /
                              1024 /
                              1024 /
                              1024

                      """
          Storage

          Total     : ${total} GB
          Available : ${available} GB
          Used      : ${total - available} GB
                      """.trimIndent()

                  } catch (e: Exception) {

                      "Unable to read storage information."
                  }
              }


              private fun listFiles(): String {

                  return """
          .
          ├── Documents/
          ├── Downloads/
          ├── Music/
          ├── Pictures/
          ├── Videos/
          └── moon/
                  """.trimIndent()
              }


              private fun cowsay(message: String): String {

                  val text =
                      if (message.isBlank())
                          "Moon Terminal is running!"
                      else
                          message

                  val line =
                      "-".repeat(text.length + 2)

                  return """
           $line
          < $text >
           $line
             \
              \
               ^__^
               (oo)\_______
                (__)\       )\/\
                    ||----w |
                    ||     ||
                  """.trimIndent()
              }


              private fun fortune(): String {

                  val messages = listOf(

                      "Keep learning. Every command teaches you something.",

                      "The terminal is only as powerful as the person using it.",

                      "Build something today.",

                      "One line of code can start a whole project.",

                      "Welcome back to Moon Terminal."

                  )

                  return messages.random()
              }


              private fun banner(text: String): String {

                  if (text.isBlank()) {
                      return "Usage: banner <text>"
                  }

                  return """
          ███╗   ███╗ ██████╗  ██████╗ ███╗   ██╗
          ████╗ ████║██╔═══██╗██╔═══██╗████╗  ██║
          ██╔████╔██║██║   ██║██║   ██║██╔██╗ ██║
          ██║╚██╔╝██║██║   ██║██║   ██║██║╚██╗██║
          ██║ ╚═╝ ██║╚██████╔╝╚██████╔╝██║ ╚████║
          ╚═╝     ╚═╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═══╝

          $text
                  """.trimIndent()
              }


              private fun ascii(name: String?): String {

                  return when (name?.lowercase()) {

                      "arch" -> """
                           /\
                          /  \
                         /    \
                        / /\   \
                       / /  \   \
                      /_/    \___\
                      Arch Linux
                      """.trimIndent()

                      "tux" -> """
                         .--.
                        |o_o |
                        |:_/ |
                       //   \ \
                      (|     | )
                     /'\_   _/`\
                     \___)=(___/
                      """.trimIndent()

                      else ->
                          "Available: ascii arch, ascii tux"
                  }
              }


              private fun calculate(expression: String): String {

                  return try {

                      when {

                          expression.contains("+") -> {

                              val p =
                                  expression.split("+", limit = 2)

                              (
                                  p[0].trim().toDouble() +
                                  p[1].trim().toDouble()
                              ).toString()
                          }

                          expression.contains("*") -> {

                              val p =
                                  expression.split("*", limit = 2)

                              (
                                  p[0].trim().toDouble() *
                                  p[1].trim().toDouble()
                              ).toString()
                          }

                          expression.contains("/") -> {

                              val p =
                                  expression.split("/", limit = 2)

                              (
                                  p[0].trim().toDouble() /
                                  p[1].trim().toDouble()
                              ).toString()
                          }

                          expression.contains("-") -> {

                              val p =
                                  expression.split("-", limit = 2)

                              (
                                  p[0].trim().toDouble() -
                                  p[1].trim().toDouble()
                              ).toString()
                          }

                          else ->
                              expression.toDouble().toString()
                      }

                  } catch (e: Exception) {

                      "Invalid calculation."
                  }
              }
          }
          EOF


      # ============================================================
      # 15. TERMINAL ACTIVITY
      # ============================================================

      - name: Create TerminalActivity.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/moon/terminal/ui/TerminalActivity.kt <<'EOF'
          package com.moon.terminal.ui

          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.widget.EditText
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.moon.terminal.R
          import com.moon.terminal.commands.CommandRegistry

          class TerminalActivity : AppCompatActivity() {

              private lateinit var output: TextView
              private lateinit var input: EditText
              private lateinit var scroll: ScrollView
              private lateinit var registry: CommandRegistry

              private val history =
                  mutableListOf<String>()

              private var historyIndex =
                  0

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  setContentView(
                      R.layout.activity_terminal
                  )

                  hideSystemUI()

                  output =
                      findViewById(
                          R.id.terminal_output
                      )

                  input =
                      findViewById(
                          R.id.input_field
                      )

                  scroll =
                      findViewById(
                          R.id.terminal_scroll
                      )

                  registry =
                      CommandRegistry(this)

                  showWelcome()

                  input.setOnKeyListener { _, keyCode, event ->

                      if (
                          event.action ==
                          KeyEvent.ACTION_DOWN
                      ) {

                          when (keyCode) {

                              KeyEvent.KEYCODE_ENTER -> {

                                  executeCommand()

                                  true
                              }

                              KeyEvent.KEYCODE_DPAD_UP -> {

                                  previousCommand()

                                  true
                              }

                              KeyEvent.KEYCODE_DPAD_DOWN -> {

                                  nextCommand()

                                  true
                              }

                              else ->
                                  false
                          }

                      } else {

                          false
                      }
                  }

                  input.requestFocus()
              }


              private fun hideSystemUI() {

                  @Suppress("DEPRECATION")

                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }


              private fun showWelcome() {

                  output.text = """

          ███╗   ███╗ ██████╗  ██████╗ ███╗   ██╗
          ████╗ ████║██╔═══██╗██╔═══██╗████╗  ██║
          ██╔████╔██║██║   ██║██║   ██║██╔██╗ ██║
          ██║╚██╔╝██║██║   ██║██║   ██║██║╚██╗██║
          ██║ ╚═╝ ██║╚██████╔╝╚██████╔╝██║ ╚████║
          ╚═╝     ╚═╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═══╝

          🌙 MOON TERMINAL LAUNCHER v1.0

          Android Terminal Environment

          Type 'help' to see available commands.

          """.trimIndent()

                  appendPrompt()
              }


              private fun appendPrompt() {

                  output.append(
                      "\n\nmoon@android:~$ "
                  )

                  scroll.post {

                      scroll.fullScroll(
                          View.FOCUS_DOWN
                      )
                  }

                  input.setText("")

                  input.requestFocus()
              }


              private fun executeCommand() {

                  val command =
                      input.text.toString().trim()

                  if (command.isEmpty()) {

                      appendPrompt()

                      return
                  }

                  history.add(command)

                  historyIndex =
                      history.size

                  output.append(
                      "$command\n"
                  )

                  val result =
                      registry.executeCommand(
                          command
                      )

                  if (result == "CLEAR") {

                      output.text = ""

                  } else {

                      output.append(
                          "$result\n"
                      )
                  }

                  appendPrompt()
              }


              private fun previousCommand() {

                  if (history.isEmpty()) {
                      return
                  }

                  historyIndex =
                      (historyIndex - 1)
                          .coerceAtLeast(0)

                  input.setText(
                      history[historyIndex]
                  )

                  input.setSelection(
                      input.text.length
                  )
              }


              private fun nextCommand() {

                  if (history.isEmpty()) {
                      return
                  }

                  historyIndex =
                      (historyIndex + 1)
                          .coerceAtMost(
                              history.size
                          )

                  if (
                      historyIndex ==
                      history.size
                  ) {

                      input.setText("")

                  } else {

                      input.setText(
                          history[historyIndex]
                      )

                      input.setSelection(
                          input.text.length
                      )
                  }
              }
          }
          EOF


      # ============================================================
      # 16. PROGUARD
      # ============================================================

      - name: Create proguard-rules.pro
        shell: bash
        run: |
          touch app/proguard-rules.pro


      # ============================================================
      # 17. CREATE SMALL DEMO ASSET
      # ============================================================

      - name: Create launcher asset
        shell: bash
        run: |
          echo "Moon Terminal Launcher" \
            > app/src/main/assets/moon_info.txt


      # ============================================================
      # 18. INSTALL GRADLE
      # ============================================================

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'


      # ============================================================
      # 19. GENERATE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.2


      # ============================================================
      # 20. BUILD APK
      # ============================================================

      - name: Build Moon Terminal Launcher
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 21. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f \
            app/build/outputs/apk/debug/app-debug.apk

          echo "================================"
          echo "BUILD SUCCESSFUL"
          echo "================================"


      # ============================================================
      # 22. UPLOAD APK
      # ============================================================

      - name: Upload Moon Terminal APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Terminal-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ============================================================
      # 23. BUILD SUMMARY
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          echo "🌙 Moon Terminal Launcher"
          echo ""
          echo "APK successfully built."
          echo ""
          echo "Artifact:"
          echo "Moon-Terminal-Launcher-APK"