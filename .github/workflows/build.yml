name: Q-Launcher v1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Q-Launcher v1
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # CREATE PROJECT
      # ------------------------------------------------------------

      - name: Create Q-Launcher project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/qlauncher
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Q-Launcher"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.qlauncher'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.qlauncher'
                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile(
                          'proguard-android-optimize.txt'
                      ), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # Q-Launcher v1
          EOF

          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Q-Launcher"
                  android:supportsRtl="true"
                  android:theme="@style/QTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.HOME" />

                          <category
                              android:name="android.intent.category.DEFAULT" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # THEME
          # --------------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="QTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #00E5FF
                  </item>

                  <item name="android:statusBarColor">
                      #05070A
                  </item>

                  <item name="android:navigationBarColor">
                      #05070A
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------------

          cat > app/src/main/java/com/qlauncher/MainActivity.kt <<'EOF'
          package com.qlauncher

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.*
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {

              private lateinit var root: FrameLayout
              private lateinit var clock: TextView
              private lateinit var search: EditText
              private lateinit var appGrid: GridLayout

              private val cyan = Color.rgb(0, 229, 255)
              private val background = Color.rgb(5, 7, 10)
              private val panel = Color.rgb(12, 17, 22)

              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)

                  window.statusBarColor = background
                  window.navigationBarColor = background

                  buildUI()
              }

              // ====================================================
              // MAIN UI
              // ====================================================

              private fun buildUI() {

                  root = FrameLayout(this)

                  root.setBackgroundColor(background)

                  root.addView(
                      QBackground(this),
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  val main = LinearLayout(this)

                  main.orientation =
                      LinearLayout.VERTICAL

                  main.setPadding(
                      24,
                      24,
                      24,
                      20
                  )

                  // ------------------------------------------------
                  // HEADER
                  // ------------------------------------------------

                  val header = LinearLayout(this)

                  header.gravity =
                      Gravity.CENTER_VERTICAL

                  val logo = TextView(this)

                  logo.text = "Q"

                  logo.textSize = 42f

                  logo.typeface =
                      Typeface.DEFAULT_BOLD

                  logo.setTextColor(cyan)

                  header.addView(
                      logo,
                      LinearLayout.LayoutParams(
                          0,
                          -2,
                          1f
                      )
                  )

                  clock = TextView(this)

                  clock.textSize = 20f

                  clock.setTextColor(
                      Color.WHITE
                  )

                  header.addView(clock)

                  main.addView(header)

                  // ------------------------------------------------
                  // STATUS
                  // ------------------------------------------------

                  val status = TextView(this)

                  status.text =
                      "Q-LAUNCHER  •  ONLINE"

                  status.textSize = 11f

                  status.setTextColor(
                      Color.rgb(
                          90,
                          140,
                          150
                      )
                  )

                  status.setPadding(
                      0,
                      0,
                      0,
                      20
                  )

                  main.addView(status)

                  // ------------------------------------------------
                  // SEARCH
                  // ------------------------------------------------

                  search = EditText(this)

                  search.hint =
                      "Search applications..."

                  search.textSize = 16f

                  search.singleLine = true

                  search.setTextColor(
                      Color.WHITE
                  )

                  search.setHintTextColor(
                      Color.rgb(
                          100,
                          120,
                          130
                      )
                  )

                  search.setPadding(
                      22,
                      0,
                      22,
                      0
                  )

                  search.background =
                      rounded(
                          panel,
                          28f,
                          Color.rgb(
                              0,
                              100,
                              120
                          )
                      )

                  main.addView(
                      search,
                      LinearLayout.LayoutParams(
                          -1,
                          58
                      )
                  )

                  search.setOnEditorActionListener {
                      _, _, _ ->

                      true
                  }

                  // ------------------------------------------------
                  // SECTION
                  // ------------------------------------------------

                  val appsTitle =
                      TextView(this)

                  appsTitle.text =
                      "APPLICATIONS"

                  appsTitle.textSize = 11f

                  appsTitle.setTextColor(
                      Color.rgb(
                          90,
                          150,
                          160
                      )
                  )

                  appsTitle.setPadding(
                      4,
                      22,
                      4,
                      10
                  )

                  main.addView(appsTitle)

                  // ------------------------------------------------
                  // APP GRID
                  // ------------------------------------------------

                  appGrid = GridLayout(this)

                  appGrid.columnCount = 3

                  main.addView(
                      appGrid,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  populateApps()

                  // ------------------------------------------------
                  // BOTTOM BAR
                  // ------------------------------------------------

                  val bottom =
                      LinearLayout(this)

                  bottom.gravity =
                      Gravity.CENTER

                  bottom.setPadding(
                      0,
                      10,
                      0,
                      0
                  )

                  val terminal =
                      bottomButton(
                          "TERMINAL"
                      )

                  val settings =
                      bottomButton(
                          "SETTINGS"
                      )

                  bottom.addView(
                      terminal,
                      LinearLayout.LayoutParams(
                          0,
                          56,
                          1f
                      )
                  )

                  bottom.addView(
                      Space(this),
                      LinearLayout.LayoutParams(
                          12,
                          1
                      )
                  )

                  bottom.addView(
                      settings,
                      LinearLayout.LayoutParams(
                          0,
                          56,
                          1f
                      )
                  )

                  main.addView(bottom)

                  root.addView(
                      main,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  setContentView(root)

                  terminal.setOnClickListener {
                      showTerminal()
                  }

                  settings.setOnClickListener {
                      openSettings()
                  }

                  updateClock()
              }

              // ====================================================
              // APPS
              // ====================================================

              private fun populateApps() {

                  appGrid.removeAllViews()

                  val pm =
                      packageManager

                  val packages =
                      pm.getInstalledApplications(
                          PackageManager.GET_META_DATA
                      )

                  val launchable =
                      packages.filter {

                          pm.getLaunchIntentForPackage(
                              it.packageName
                          ) != null
                      }.sortedBy {

                          pm.getApplicationLabel(
                              it
                          ).toString()
                      }

                  for (info in launchable) {

                      val label =
                          pm.getApplicationLabel(
                              info
                          ).toString()

                      addApp(
                          label,
                          info.packageName
                      )
                  }
              }

              private fun addApp(
                  label: String,
                  packageName: String
              ) {

                  val button =
                      TextView(this)

                  button.text = label

                  button.textSize = 13f

                  button.gravity =
                      Gravity.CENTER

                  button.setTextColor(
                      Color.WHITE
                  )

                  button.setPadding(
                      6,
                      12,
                      6,
                      12
                  )

                  button.background =
                      rounded(
                          panel,
                          20f,
                          Color.rgb(
                              35,
                              55,
                              65
                          )
                      )

                  val params =
                      GridLayout.LayoutParams()

                  params.width = 0
                  params.height = 100

                  params.columnSpec =
                      GridLayout.spec(
                          GridLayout.UNDEFINED,
                          1f
                      )

                  params.setMargins(
                      4,
                      4,
                      4,
                      4
                  )

                  button.layoutParams =
                      params

                  button.setOnClickListener {

                      val launch =
                          packageManager
                              .getLaunchIntentForPackage(
                                  packageName
                              )

                      if (launch != null) {
                          startActivity(launch)
                      }
                  }

                  appGrid.addView(button)
              }

              // ====================================================
              // TERMINAL
              // ====================================================

              private fun showTerminal() {

                  val dialog =
                      Dialog(this)

                  val box =
                      LinearLayout(this)

                  box.orientation =
                      LinearLayout.VERTICAL

                  box.setPadding(
                      24,
                      24,
                      24,
                      24
                  )

                  box.setBackgroundColor(
                      Color.rgb(
                          3,
                          8,
                          10
                      )
                  )

                  val title =
                      TextView(this)

                  title.text =
                      "Q TERMINAL"

                  title.textSize = 20f

                  title.typeface =
                      Typeface.MONOSPACE

                  title.setTextColor(cyan)

                  box.addView(title)

                  val output =
                      TextView(this)

                  output.text =
                      "\nQ-LAUNCHER TERMINAL\n" +
                      "System online.\n" +
                      "Terminal interface ready.\n\n" +
                      "q@launcher:~$ "

                  output.textSize = 14f

                  output.typeface =
                      Typeface.MONOSPACE

                  output.setTextColor(
                      Color.rgb(
                          180,
                          240,
                          220
                      )
                  )

                  output.setPadding(
                      0,
                      24,
                      0,
                      20
                  )

                  box.addView(output)

                  val input =
                      EditText(this)

                  input.hint =
                      "Enter command..."

                  input.typeface =
                      Typeface.MONOSPACE

                  input.setTextColor(
                      Color.WHITE
                  )

                  input.setHintTextColor(
                      Color.GRAY
                  )

                  input.singleLine = true

                  box.addView(input)

                  input.setOnEditorActionListener {
                      _, _, _ ->

                      val command =
                          input.text
                              .toString()
                              .trim()

                      output.append(
                          "\n$command\n"
                      )

                      when (command.lowercase()) {

                          "clear" ->
                              output.text =
                                  "q@launcher:~$ "

                          "help" ->
                              output.append(
                                  "Commands:\n" +
                                  "help\n" +
                                  "clear\n" +
                                  "apps\n" +
                                  "settings\n"
                              )

                          "apps" ->
                              output.append(
                                  "Installed apps: " +
                                  appGrid.childCount +
                                  "\n"
                              )

                          "settings" -> {
                              dialog.dismiss()
                              openSettings()
                          }

                          else ->
                              output.append(
                                  "Command not available in v1.\n"
                              )
                      }

                      input.text.clear()

                      true
                  }

                  dialog.setContentView(box)

                  val window =
                      dialog.window

                  window?.setBackgroundDrawableResource(
                      android.R.color.transparent
                  )

                  window?.setLayout(
                      -1,
                      -2
                  )

                  dialog.show()
              }

              // ====================================================
              // SETTINGS
              // ====================================================

              private fun openSettings() {

                  startActivity(
                      Intent(
                          Settings.ACTION_SETTINGS
                      )
                  )
              }

              // ====================================================
              // BOTTOM BUTTON
              // ====================================================

              private fun bottomButton(
                  text: String
              ): TextView {

                  val button =
                      TextView(this)

                  button.text = text

                  button.textSize = 13f

                  button.gravity =
                      Gravity.CENTER

                  button.setTextColor(cyan)

                  button.background =
                      rounded(
                          Color.rgb(
                              8,
                              22,
                              27
                          ),
                          26f,
                          Color.rgb(
                              0,
                              100,
                              120
                          )
                      )

                  return button
              }

              // ====================================================
              // SHAPES
              // ====================================================

              private fun rounded(
                  color: Int,
                  radius: Float,
                  stroke: Int
              ): GradientDrawable {

                  val drawable =
                      GradientDrawable()

                  drawable.setColor(color)

                  drawable.cornerRadius =
                      radius

                  drawable.setStroke(
                      1,
                      stroke
                  )

                  return drawable
              }

              // ====================================================
              // CLOCK
              // ====================================================

              private fun updateClock() {

                  val handler =
                      android.os.Handler(
                          mainLooper
                      )

                  val runnable =
                      object : Runnable {

                          override fun run() {

                              val format =
                                  SimpleDateFormat(
                                      "HH:mm:ss",
                                      Locale.getDefault()
                                  )

                              clock.text =
                                  format.format(
                                      Date()
                                  )

                              handler.postDelayed(
                                  this,
                                  1000
                              )
                          }
                      }

                  handler.post(runnable)
              }
          }

          // ========================================================
          // BACKGROUND
          // ========================================================

          class QBackground(
              context: Context
          ) : View(context) {

              private val paint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              override fun onDraw(
                  canvas: Canvas
              ) {

                  val width =
                      width.toFloat()

                  val height =
                      height.toFloat()

                  val gradient =
                      LinearGradient(
                          0f,
                          0f,
                          width,
                          height,
                          Color.rgb(
                              5,
                              7,
                              10
                          ),
                          Color.rgb(
                              7,
                              22,
                              28
                          ),
                          Shader.TileMode.CLAMP
                      )

                  paint.shader =
                      gradient

                  canvas.drawRect(
                      0f,
                      0f,
                      width,
                      height,
                      paint
                  )

                  paint.shader = null

                  paint.color =
                      Color.argb(
                          20,
                          0,
                          229,
                          255
                      )

                  paint.strokeWidth = 1f

                  val spacing = 60f

                  var x = 0f

                  while (x < width) {

                      canvas.drawLine(
                          x,
                          0f,
                          x,
                          height,
                          paint
                      )

                      x += spacing
                  }

                  var y = 0f

                  while (y < height) {

                      canvas.drawLine(
                          0f,
                          y,
                          width,
                          y,
                          paint
                      )

                      y += spacing
                  }
              }
          }
          EOF

      # ------------------------------------------------------------
      # GRADLE 8.9
      # ------------------------------------------------------------

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Clean
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # SHOW APK
      # ------------------------------------------------------------

      - name: Locate APK
        run: |
          echo "======================================"
          echo "Q-LAUNCHER V1 APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo "======================================"

      # ------------------------------------------------------------
      # UPLOAD
      # ------------------------------------------------------------

      - name: Upload Q-Launcher v1
        uses: actions/upload-artifact@v4
        with:
          name: Q-Launcher-v1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30