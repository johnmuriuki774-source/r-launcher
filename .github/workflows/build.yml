name: Q-Launcher 590MB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  TARGET_MB: 590
  TARGET_BYTES: 618659840
  MIN_BYTES: 617611264
  MAX_BYTES: 619708416

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # ANDROID
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================================
      # PROJECT DIRECTORIES
      # ==========================================================

      - name: Create project structure
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/qlauncher/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

      # ==========================================================
      # SETTINGS
      # ==========================================================

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Q-Launcher"

          include(":app")
          EOF

      # ==========================================================
      # ROOT GRADLE
      # ==========================================================

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      # ==========================================================
      # GRADLE PROPERTIES
      # ==========================================================

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ==========================================================
      # APP GRADLE
      # ==========================================================

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.qlauncher.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.qlauncher.app'
                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              androidResources {
                  noCompress += ['bin']
              }
          }
          EOF

      # ==========================================================
      # MANIFEST
      # ==========================================================

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="Q-Launcher"
                  android:supportsRtl="true"
                  android:theme="@style/QTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                          <category
                              android:name="android.intent.category.HOME" />

                          <category
                              android:name="android.intent.category.DEFAULT" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ==========================================================
      # THEME
      # ==========================================================

      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="QTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#050508</item>
                  <item name="android:statusBarColor">#050508</item>
                  <item name="android:colorAccent">#58A6FF</item>

              </style>

          </resources>
          EOF

      # ==========================================================
      # Q-LAUNCHER MAIN ACTIVITY
      #
      # Features:
      # - Immersive mode
      # - Home screen
      # - Clock
      # - Search
      # - App drawer
      # - Installed-app discovery
      # - Launch applications
      # - Settings panel
      # - Long-press style interface
      # - Scrollable app list
      # ==========================================================

      - name: Create Q Launcher
        run: |
          cat > app/src/main/java/com/qlauncher/app/MainActivity.java <<'EOF'
          package com.qlauncher.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private LinearLayout content;

              private final Handler handler =
                      new Handler();

              private TextView clock;

              private int dp(int value) {
                  return (int) (
                      value *
                      getResources()
                          .getDisplayMetrics()
                          .density
                  );
              }

              private TextView label(
                      String text,
                      float size
              ) {
                  TextView view =
                          new TextView(this);

                  view.setText(text);
                  view.setTextColor(Color.WHITE);
                  view.setTextSize(size);
                  view.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  return view;
              }

              private GradientDrawable card(
                      int color,
                      int radius
              ) {
                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);
                  drawable.setCornerRadius(
                          dp(radius)
                  );

                  return drawable;
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState
              ) {
                  super.onCreate(
                          savedInstanceState
                  );

                  immersive();

                  home();
              }

              private void immersive() {

                  if (android.os.Build.VERSION.SDK_INT >= 30) {

                      WindowInsetsController controller =
                              getWindow()
                                  .getInsetsController();

                      if (controller != null) {

                          controller.hide(
                              WindowInsets.Type.statusBars()
                              |
                              WindowInsets.Type.navigationBars()
                          );

                          controller.setSystemBarsBehavior(
                              WindowInsetsController
                                  .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }

                  } else {

                      getWindow()
                          .getDecorView()
                          .setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN
                              |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              |
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              |
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              |
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                  }
              }

              private void setupRoot() {

                  root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setPadding(
                          dp(18),
                          dp(22),
                          dp(18),
                          dp(18)
                  );

                  root.setBackgroundColor(
                          Color.rgb(5, 6, 10)
                  );

                  setContentView(root);
              }

              private void home() {

                  setupRoot();

                  // HEADER
                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL
                  );

                  TextView q =
                          label("Q", 32);

                  q.setTextColor(
                          Color.rgb(88,166,255)
                  );

                  q.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  header.addView(
                          q,
                          new LinearLayout.LayoutParams(
                                  dp(55),
                                  dp(55)
                          )
                  );

                  TextView title =
                          label(
                                  "Q-LAUNCHER",
                                  20
                          );

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(55),
                                  1
                          )
                  );

                  TextView menu =
                          label("⋮", 30);

                  menu.setGravity(
                          Gravity.CENTER
                  );

                  menu.setOnClickListener(
                          v -> settings()
                  );

                  header.addView(
                          menu,
                          new LinearLayout.LayoutParams(
                                  dp(50),
                                  dp(55)
                          )
                  );

                  root.addView(header);

                  // CLOCK
                  clock =
                          label("", 48);

                  clock.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          clock,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(115)
                          )
                  );

                  updateClock();

                  // SEARCH
                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search apps..."
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setSingleLine(true);

                  search.setPadding(
                          dp(18),
                          0,
                          dp(18),
                          0
                  );

                  search.setBackground(
                          card(
                              Color.rgb(20,23,31),
                              20
                          )
                  );

                  root.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(55)
                          )
                  );

                  search.setOnEditorActionListener(
                      (v, actionId, event) -> {

                          showApps(
                              search.getText()
                                  .toString()
                          );

                          return true;
                      }
                  );

                  // CONTENT
                  content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.addView(content);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  // QUICK ACTIONS
                  addButton(
                          "APP DRAWER",
                          () -> showApps("")
                  );

                  addButton(
                          "SEARCH",
                          () -> search.requestFocus()
                  );

                  addButton(
                          "SETTINGS",
                          this::settings
                  );

                  TextView version =
                          label(
                              "Q-LAUNCHER • v1.0",
                              11
                          );

                  version.setGravity(
                          Gravity.CENTER
                  );

                  version.setTextColor(
                          Color.DKGRAY
                  );

                  root.addView(
                          version,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(35)
                          )
                  );
              }

              private void addButton(
                      String text,
                      Runnable action
              ) {

                  TextView button =
                          label(text, 15);

                  button.setGravity(
                          Gravity.CENTER
                  );

                  button.setBackground(
                          card(
                              Color.rgb(18,22,30),
                              18
                          )
                  );

                  button.setOnClickListener(
                          v -> action.run()
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(58)
                          );

                  p.setMargins(
                          0,
                          dp(7),
                          0,
                          dp(7)
                  );

                  content.addView(
                          button,
                          p
                  );
              }

              private void showApps(
                      String query
              ) {

                  setupRoot();

                  TextView back =
                          label(
                              "‹  Q-LAUNCHER",
                              20
                          );

                  back.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  back.setOnClickListener(
                          v -> home()
                  );

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(60)
                          )
                  );

                  EditText search =
                          new EditText(this);

                  search.setHint(
                          "Search applications"
                  );

                  search.setText(query);

                  search.setTextColor(
                          Color.WHITE
                  );

                  search.setHintTextColor(
                          Color.GRAY
                  );

                  search.setSingleLine();

                  search.setBackground(
                          card(
                              Color.rgb(20,23,31),
                              18
                          )
                  );

                  root.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(55)
                          )
                  );

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  scroll.addView(list);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1
                          )
                  );

                  PackageManager pm =
                          getPackageManager();

                  List<ApplicationInfo> apps =
                          new ArrayList<>();

                  for (
                      ApplicationInfo info :
                      pm.getInstalledApplications(
                          PackageManager.GET_META_DATA
                      )
                  ) {

                      if (
                          pm.getLaunchIntentForPackage(
                              info.packageName
                          ) != null
                      ) {

                          apps.add(info);
                      }
                  }

                  Collections.sort(
                      apps,
                      new Comparator<ApplicationInfo>() {

                          @Override
                          public int compare(
                              ApplicationInfo a,
                              ApplicationInfo b
                          ) {

                              String x =
                                  pm.getApplicationLabel(a)
                                      .toString();

                              String y =
                                  pm.getApplicationLabel(b)
                                      .toString();

                              return x.compareToIgnoreCase(y);
                          }
                      }
                  );

                  for (
                      ApplicationInfo info :
                      apps
                  ) {

                      String name =
                          pm.getApplicationLabel(
                              info
                          ).toString();

                      if (
                          query != null
                          &&
                          !query.isEmpty()
                          &&
                          !name.toLowerCase(
                              Locale.ROOT
                          ).contains(
                              query.toLowerCase(
                                  Locale.ROOT
                              )
                          )
                      ) {

                          continue;
                      }

                      TextView app =
                          label(name, 16);

                      app.setPadding(
                          dp(18),
                          0,
                          dp(18),
                          0
                      );

                      app.setBackground(
                          card(
                              Color.rgb(16,19,26),
                              16
                          )
                      );

                      app.setOnClickListener(
                          v -> {

                              Intent intent =
                                  pm.getLaunchIntentForPackage(
                                      info.packageName
                                  );

                              if (intent != null) {

                                  startActivity(intent);
                              }
                          }
                      );

                      LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                              -1,
                              dp(58)
                          );

                      p.setMargins(
                          0,
                          dp(5),
                          0,
                          dp(5)
                      );

                      list.addView(app, p);
                  }
              }

              private void settings() {

                  setupRoot();

                  TextView back =
                          label(
                              "‹  SETTINGS",
                              22
                          );

                  back.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  back.setOnClickListener(
                          v -> home()
                  );

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(65)
                          )
                  );

                  addSetting(
                      "Immersive Mode",
                      "Hide Android system bars",
                      this::immersive
                  );

                  addSetting(
                      "Application Drawer",
                      "View installed applications",
                      () -> showApps("")
                  );

                  addSetting(
                      "Launcher Home",
                      "Return to Q-Launcher",
                      this::home
                  );

                  addSetting(
                      "About Q-Launcher",
                      "Version 1.0",
                      () -> { }
                  );
              }

              private void addSetting(
                      String title,
                      String subtitle,
                      Runnable action
              ) {

                  LinearLayout item =
                          new LinearLayout(this);

                  item.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  item.setPadding(
                          dp(18),
                          dp(10),
                          dp(18),
                          dp(10)
                  );

                  item.setBackground(
                          card(
                              Color.rgb(17,20,28),
                              18
                          )
                  );

                  TextView a =
                          label(title, 16);

                  TextView b =
                          label(subtitle, 12);

                  b.setTextColor(
                          Color.GRAY
                  );

                  item.addView(a);
                  item.addView(b);

                  item.setOnClickListener(
                          v -> action.run()
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                              -1,
                              dp(78)
                          );

                  p.setMargins(
                          0,
                          dp(7),
                          0,
                          dp(7)
                  );

                  root.addView(item, p);
              }

              private void updateClock() {

                  if (clock == null) {
                      return;
                  }

                  String value =
                      new SimpleDateFormat(
                          "HH:mm",
                          Locale.getDefault()
                      ).format(
                          new Date()
                      );

                  clock.setText(value);

                  handler.postDelayed(
                      this::updateClock,
                      1000
                  );
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  immersive();
              }
          }
          EOF

      # ==========================================================
      # GRADLE WRAPPER
      # ==========================================================

      - name: Install Gradle 8.9
        run: |
          mkdir -p "$HOME/gradle"

          curl -L \
            -o "$HOME/gradle/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q \
            "$HOME/gradle/gradle.zip" \
            -d "$HOME/gradle"

          "$HOME/gradle/gradle-8.9/bin/gradle" wrapper \
            --gradle-version 8.9

          chmod +x gradlew

      # ==========================================================
      # FIRST BUILD
      # ==========================================================

      - name: Initial build
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # CREATE INITIAL PADDING
      # ==========================================================

      - name: Create initial asset
        run: |
          python3 <<'PY'
          import os

          path = "app/src/main/assets/q_launcher_data.bin"

          target = 500 * 1024 * 1024

          block = os.urandom(1024 * 1024)

          with open(path, "wb") as f:
              remaining = target

              while remaining > 0:
                  n = min(len(block), remaining)
                  f.write(block[:n])
                  remaining -= n

          print(
              "Initial asset:",
              os.path.getsize(path),
              "bytes"
          )
          PY

      # ==========================================================
      # BUILD / MEASURE / ADJUST
      #
      # This is the important part.
      #
      # It does NOT simply assume the APK is 590 MB.
      # It measures the actual APK and adjusts the asset.
      # ==========================================================

      - name: Tune APK to approximately 590 MB
        shell: bash
        run: |

          set -e

          TARGET="$TARGET_BYTES"
          MIN="$MIN_BYTES"
          MAX="$MAX_BYTES"

          ASSET="app/src/main/assets/q_launcher_data.bin"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          for ROUND in 1 2 3 4 5 6 7 8; do

              echo ""
              echo "=========================================="
              echo "590 MB SIZE TUNING ROUND $ROUND"
              echo "=========================================="

              ./gradlew assembleDebug \
                --no-daemon

              CURRENT=$(stat -c%s "$APK")

              echo "Current APK:"
              echo "$CURRENT bytes"

              echo "Target:"
              echo "$TARGET bytes"

              if [ "$CURRENT" -ge "$MIN" ] &&
                 [ "$CURRENT" -le "$MAX" ]; then

                  echo ""
                  echo "=========================================="
                  echo "SUCCESS"
                  echo "APK IS WITHIN 1 MB OF 590 MiB"
                  echo "=========================================="

                  break
              fi

              DIFFERENCE=$((TARGET - CURRENT))

              CURRENT_ASSET=$(stat -c%s "$ASSET")

              NEW_ASSET=$((CURRENT_ASSET + DIFFERENCE))

              if [ "$NEW_ASSET" -lt 1 ]; then
                  NEW_ASSET=1
              fi

              echo "Adjusting asset:"
              echo "$CURRENT_ASSET -> $NEW_ASSET bytes"

              python3 - "$ASSET" "$NEW_ASSET" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          target = int(sys.argv[2])

          current = os.path.getsize(path)

          if target > current:

              block = os.urandom(1024 * 1024)

              with open(path, "ab") as f:

                  remaining = target - current

                  while remaining:

                      n = min(
                          len(block),
                          remaining
                      )

                      f.write(
                          block[:n]
                      )

                      remaining -= n

          elif target < current:

              with open(path, "r+b") as f:
                  f.truncate(target)

          print(
              "Asset size:",
              os.path.getsize(path)
          )
          PY

          done

      # ==========================================================
      # FINAL VERIFICATION
      # ==========================================================

      - name: Verify final APK size
        shell: bash
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          MB=$(python3 - "$SIZE" <<'PY'
          import sys

          size = int(sys.argv[1])

          print(
              f"{size / 1024 / 1024:.2f}"
          )
          PY
          )

          echo ""
          echo "=========================================="
          echo "FINAL Q-LAUNCHER APK"
          echo "=========================================="
          echo "File: $APK"
          echo "Bytes: $SIZE"
          echo "MiB: $MB"
          echo "=========================================="

          if [ "$SIZE" -lt "$MIN_BYTES" ] ||
             [ "$SIZE" -gt "$MAX_BYTES" ]; then

              echo ""
              echo "ERROR:"
              echo "Final APK is NOT within 1 MiB of 590 MiB."
              exit 1
          fi

          echo ""
          echo "590 MB TARGET VERIFIED."

      # ==========================================================
      # APK CHECKSUM
      # ==========================================================

      - name: Generate checksum
        run: |
          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            > q-launcher.sha256

          cat q-launcher.sha256

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload Q-Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Q-Launcher-v1-590MB
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            q-launcher.sha256
          if-no-files-found: error
          retention-days: 30