name: Build Moon Terminal Launcher

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------
      # 3. Set up Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # --------------------------------------------------
      # 4. Create Android project structure
      # --------------------------------------------------
      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/moon/terminal
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      # --------------------------------------------------
      # 5. settings.gradle
      # --------------------------------------------------
      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Moon Terminal Launcher"

          include(":app")
          EOF

      # --------------------------------------------------
      # 6. Root build.gradle
      # --------------------------------------------------
      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

      # --------------------------------------------------
      # 7. Gradle properties
      # --------------------------------------------------
      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          EOF

      # --------------------------------------------------
      # 8. Android app build.gradle
      # --------------------------------------------------
      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.moon.terminal'
              compileSdk 34

              defaultConfig {
                  applicationId "com.moon.terminal"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile(
                          'proguard-android-optimize.txt'
                      ), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      # --------------------------------------------------
      # 9. ProGuard file
      # --------------------------------------------------
      - name: Create ProGuard file
        run: |
          cat > app/proguard-rules.pro <<'EOF'
          # Moon Terminal Launcher
          EOF

      # --------------------------------------------------
      # 10. Android Manifest
      # --------------------------------------------------
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MoonTerminal"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:launchMode="singleTask">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.HOME" />

                          <category
                              android:name="android.intent.category.DEFAULT" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # --------------------------------------------------
      # 11. Strings
      # --------------------------------------------------
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Moon Terminal Launcher</string>
          </resources>
          EOF

      # --------------------------------------------------
      # 12. Colors
      # --------------------------------------------------
      - name: Create colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>

              <color name="moon_background">#05070A</color>
              <color name="moon_terminal">#090D12</color>
              <color name="moon_panel">#111820</color>

              <color name="moon_green">#38E878</color>
              <color name="moon_blue">#4DA6FF</color>
              <color name="moon_purple">#A855F7</color>

              <color name="moon_text">#D8E2EA</color>
              <color name="moon_muted">#71808C</color>

          </resources>
          EOF

      # --------------------------------------------------
      # 13. Theme
      # --------------------------------------------------
      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="Theme.MoonTerminal"
                  parent="Theme.AppCompat.NoActionBar">

                  <item name="android:fontFamily">monospace</item>

                  <item name="android:windowFullscreen">true</item>

                  <item name="android:statusBarColor">
                      @android:color/transparent
                  </item>

                  <item name="android:navigationBarColor">
                      @android:color/black
                  </item>

                  <item name="android:windowBackground">
                      @color/moon_background
                  </item>

              </style>

          </resources>
          EOF

      # --------------------------------------------------
      # 14. Terminal layout
      # --------------------------------------------------
      - name: Create terminal layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#05070A">

              <TextView
                  android:id="@+id/header"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:padding="12dp"
                  android:text="🌙 MOON TERMINAL"
                  android:textColor="#38E878"
                  android:textSize="18sp"
                  android:typeface="monospace"
                  android:background="#090D12" />

              <ScrollView
                  android:id="@+id/scroll"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#05070A"
                  android:fillViewport="true">

                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:padding="12dp"
                      android:textColor="#D8E2EA"
                      android:textSize="14sp"
                      android:typeface="monospace"
                      android:lineSpacingExtra="3dp" />

              </ScrollView>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="6dp"
                  android:background="#111820">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="moon@android:$ "
                      android:textColor="#38E878"
                      android:textSize="14sp"
                      android:typeface="monospace" />

                  <EditText
                      android:id="@+id/input"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:background="@android:color/transparent"
                      android:singleLine="true"
                      android:textColor="#D8E2EA"
                      android:textColorHint="#71808C"
                      android:textSize="14sp"
                      android:typeface="monospace"
                      android:hint="command" />

              </LinearLayout>

          </LinearLayout>
          EOF

      # --------------------------------------------------
      # 15. MainActivity
      # --------------------------------------------------
      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/moon/terminal/MainActivity.java <<'EOF'
          package com.moon.terminal;

          import android.os.Bundle;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StatFs;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              private TextView output;
              private EditText input;
              private ScrollView scroll;

              private boolean rainbow = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  enableImmersiveMode();

                  setContentView(R.layout.activity_main);

                  output = findViewById(R.id.output);
                  input = findViewById(R.id.input);
                  scroll = findViewById(R.id.scroll);

                  showWelcome();

                  input.setOnKeyListener(
                      (view, keyCode, event) -> {

                          if (keyCode == KeyEvent.KEYCODE_ENTER
                              && event.getAction()
                              == KeyEvent.ACTION_DOWN) {

                              executeCommand();

                              return true;
                          }

                          return false;
                      }
                  );

                  input.requestFocus();
              }

              private void enableImmersiveMode() {

                  getWindow()
                      .getDecorView()
                      .setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
              }

              private void showWelcome() {

                  append(
                      "╔══════════════════════════════════════╗\n"
                      + "║       🌙 MOON TERMINAL LAUNCHER      ║\n"
                      + "║              v1.0                    ║\n"
                      + "╚══════════════════════════════════════╝\n\n"
                      + "Welcome to Moon Terminal.\n\n"
                      + "Type 'help' to see available commands.\n\n"
                  );
              }

              private void executeCommand() {

                  String command = input
                      .getText()
                      .toString()
                      .trim();

                  if (command.isEmpty()) {
                      append("moon@android:$ \n");
                      return;
                  }

                  append(
                      "moon@android:$ "
                      + command
                      + "\n"
                  );

                  String result = runCommand(command);

                  if (!result.isEmpty()) {
                      append(result + "\n");
                  }

                  input.setText("");

                  scroll.post(
                      () -> scroll.fullScroll(
                          View.FOCUS_DOWN
                      )
                  );
              }

              private String runCommand(String raw) {

                  String[] parts = raw.split("\\s+");

                  String command =
                      parts[0].toLowerCase(Locale.ROOT);

                  switch (command) {

                      case "help":
                          return help();

                      case "clear":
                          output.setText("");
                          return "";

                      case "neofetch":
                          return neofetch();

                      case "sysinfo":
                          return sysinfo();

                      case "free":
                          return memory();

                      case "df":
                          return disk();

                      case "date":
                          return new SimpleDateFormat(
                              "yyyy-MM-dd HH:mm:ss",
                              Locale.getDefault()
                          ).format(new Date());

                      case "whoami":
                          return "moon";

                      case "uname":
                          return "Moon Linux android aarch64";

                      case "pwd":
                          return "/home/moon";

                      case "echo":
                          return raw.length() > 5
                              ? raw.substring(5)
                              : "";

                      case "ls":
                          return
                              "Documents  Downloads  Music  "
                              + "Pictures  Games";

                      case "cowsay":
                          return cowsay(
                              raw.length() > 6
                                  ? raw.substring(6).trim()
                                  : "Moon Terminal!"
                          );

                      case "fortune":
                          return fortune();

                      case "theme":
                          return themes();

                      case "rainbow":

                          rainbow = !rainbow;

                          return rainbow
                              ? "🌈 Rainbow mode enabled."
                              : "Rainbow mode disabled.";

                      case "ascii":
                          return tux();

                      default:
                          return
                              "Command not found: "
                              + command
                              + "\nType 'help' for commands.";
                  }
              }

              private String help() {

                  return
                      "SYSTEM\n"
                      + "  neofetch   System overview\n"
                      + "  sysinfo    Android information\n"
                      + "  free       Memory information\n"
                      + "  df         Storage information\n"
                      + "  date       Current date/time\n"
                      + "  uname      System name\n"
                      + "  whoami     Current user\n\n"

                      + "FILES\n"
                      + "  ls         List directories\n"
                      + "  pwd        Current directory\n"
                      + "  echo       Print text\n\n"

                      + "FUN\n"
                      + "  cowsay     ASCII cow\n"
                      + "  fortune    Random message\n"
                      + "  ascii      ASCII art\n\n"

                      + "CUSTOM\n"
                      + "  theme      List themes\n"
                      + "  rainbow    Toggle rainbow mode\n"
                      + "  clear      Clear terminal";
              }

              private String neofetch() {

                  return
                      "       ██████████   Moon Terminal\n"
                      + "       ██████████   OS: Moon Android\n"
                      + "       ██████████   Device: "
                      + Build.MANUFACTURER
                      + " "
                      + Build.MODEL
                      + "\n"
                      + "       ██████████   Android: "
                      + Build.VERSION.RELEASE
                      + "\n"
                      + "       ██████████   API: "
                      + Build.VERSION.SDK_INT
                      + "\n"
                      + "       ██████████   ABI: "
                      + Build.SUPPORTED_ABIS[0];
              }

              private String sysinfo() {

                  return
                      "System Information\n"
                      + "────────────────────\n"
                      + "Manufacturer: "
                      + Build.MANUFACTURER
                      + "\nModel: "
                      + Build.MODEL
                      + "\nAndroid: "
                      + Build.VERSION.RELEASE
                      + "\nAPI: "
                      + Build.VERSION.SDK_INT
                      + "\nArchitecture: "
                      + Build.SUPPORTED_ABIS[0];
              }

              private String memory() {

                  Runtime runtime =
                      Runtime.getRuntime();

                  long total =
                      runtime.totalMemory() / 1048576;

                  long free =
                      runtime.freeMemory() / 1048576;

                  long max =
                      runtime.maxMemory() / 1048576;

                  return
                      "Memory\n"
                      + "Total: "
                      + total
                      + " MB\n"
                      + "Free: "
                      + free
                      + " MB\n"
                      + "Max: "
                      + max
                      + " MB";
              }

              private String disk() {

                  try {

                      StatFs stat =
                          new StatFs(
                              Environment
                                  .getDataDirectory()
                                  .getPath()
                          );

                      long total =
                          stat.getBlockCountLong()
                          * stat.getBlockSizeLong();

                      long available =
                          stat.getAvailableBlocksLong()
                          * stat.getBlockSizeLong();

                      double totalGb =
                          total / 1073741824.0;

                      double availableGb =
                          available / 1073741824.0;

                      return String.format(
                          Locale.US,
                          "Storage\n"
                          + "Total: %.2f GB\n"
                          + "Available: %.2f GB",
                          totalGb,
                          availableGb
                      );

                  } catch (Exception e) {

                      return
                          "Unable to read storage information.";
                  }
              }

              private String cowsay(String message) {

                  return
                      " ______________________\n"
                      + "< "
                      + message
                      + " >\n"
                      + " ----------------------\n"
                      + "        \\\n"
                      + "         ^__^\n"
                      + "         (oo)\\_______\n"
                      + "          (__)\\       )\\/\\\n"
                      + "              ||----w |\n"
                      + "              ||     ||";
              }

              private String fortune() {

                  String[] fortunes = {

                      "Keep exploring.",
                      "Every command teaches you something.",
                      "Build something amazing today.",
                      "The terminal is your playground.",
                      "Moon Terminal is just getting started."

                  };

                  return fortunes[
                      (int) (
                          Math.random()
                          * fortunes.length
                      )
                  ];
              }

              private String themes() {

                  return
                      "Moon Themes\n"
                      + "────────────\n"
                      + "midnight\n"
                      + "cyberpunk\n"
                      + "ocean\n"
                      + "forest\n"
                      + "sunset\n"
                      + "retro\n"
                      + "monochrome\n"
                      + "rainbow";
              }

              private String tux() {

                  return
                      "   .--.\n"
                      + "  |o_o |\n"
                      + "  |:_/ |\n"
                      + " //   \\\\ \\\n"
                      + "(|     | )\n"
                      + "/'\\_   _/`\\\n"
                      + "\\___)=(___/";
              }

              private void append(String text) {

                  output.append(text);
              }
          }
          EOF

      # --------------------------------------------------
      # 16. Generate Gradle wrapper
      # --------------------------------------------------
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      # --------------------------------------------------
      # 17. Configure Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # 18. Build APK
      # --------------------------------------------------
      - name: Build Moon Terminal Launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # --------------------------------------------------
      # 19. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      # --------------------------------------------------
      # 20. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Terminal-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error