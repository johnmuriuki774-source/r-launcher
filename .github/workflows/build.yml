name: Q-Launcher ~590MB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. DOWNLOAD PROJECT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # 3. ANDROID SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 4. CREATE PROJECT
      # ------------------------------------------------------------
      - name: Create Q-Launcher project
        shell: bash
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/qlauncher
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/qlauncher_assets

          # --------------------------------------------------------
          # SETTINGS
          # --------------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Q-Launcher"

          include(":app")
          EOF

          # --------------------------------------------------------
          # ROOT BUILD
          # --------------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # --------------------------------------------------------
          # GRADLE PROPERTIES
          # --------------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------------------------
          # APP BUILD
          # --------------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.qlauncher'

              compileSdk 35

              defaultConfig {

                  applicationId "com.qlauncher"

                  minSdk 26

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"

              }

              buildTypes {

                  debug {

                      minifyEnabled false

                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              packaging {

                  resources {

                      excludes += [
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt"
                      ]

                  }

              }

          }
          EOF

          # --------------------------------------------------------
          # COLORS
          # --------------------------------------------------------

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="black">#000000</color>

              <color name="white">#FFFFFF</color>

              <color name="cyan">#00E5FF</color>

              <color name="green">#00FF66</color>

              <color name="gray">#777777</color>

          </resources>
          EOF

          # --------------------------------------------------------
          # THEME
          # --------------------------------------------------------

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="QLauncherTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">monospace</item>

                  <item name="android:windowFullscreen">true</item>

                  <item name="android:colorAccent">@color/cyan</item>

                  <item name="android:navigationBarColor">@color/black</item>

                  <item name="android:statusBarColor">@color/black</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:allowBackup="false"

                  android:label="Q-Launcher"

                  android:supportsRtl="true"

                  android:theme="@style/QLauncherTheme">

                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                          <category
                              android:name="android.intent.category.HOME"/>

                          <category
                              android:name="android.intent.category.DEFAULT"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # MAIN ACTIVITY
          # --------------------------------------------------------

          cat > app/src/main/java/com/qlauncher/MainActivity.java <<'EOF'
          package com.qlauncher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private LinearLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  enableImmersive();

                  root = new LinearLayout(this);

                  root.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  root.setGravity(
                      Gravity.CENTER
                  );

                  root.setPadding(
                      40,
                      40,
                      40,
                      40
                  );

                  root.setBackgroundColor(
                      Color.BLACK
                  );

                  TextView title =
                      makeText(
                          "Q-LAUNCHER",
                          32,
                          Color.CYAN
                      );

                  TextView subtitle =
                      makeText(
                          "IMMERSIVE TERMINAL HOME",
                          13,
                          Color.GRAY
                      );

                  TextView terminal =
                      makeText(
                          "john@q-launcher:~$ _",
                          18,
                          Color.GREEN
                      );

                  TextView menu =
                      makeText(
                          "[ APPLICATIONS ]",
                          19,
                          Color.CYAN
                      );

                  TextView open =
                      makeText(
                          "OPEN APP MENU",
                          17,
                          Color.WHITE
                      );

                  open.setPadding(
                      30,
                      35,
                      30,
                      35
                  );

                  open.setOnClickListener(
                      v -> Toast.makeText(
                          MainActivity.this,
                          "Q-Launcher App Menu",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  root.addView(title);

                  root.addView(subtitle);

                  space(35);

                  root.addView(terminal);

                  space(45);

                  root.addView(menu);

                  space(20);

                  root.addView(open);

                  setContentView(root);

              }

              private TextView makeText(
                  String value,
                  int size,
                  int color
              ) {

                  TextView text =
                      new TextView(this);

                  text.setText(value);

                  text.setTextSize(size);

                  text.setTextColor(color);

                  text.setTypeface(
                      Typeface.MONOSPACE
                  );

                  text.setGravity(
                      Gravity.CENTER
                  );

                  return text;

              }

              private void space(int height) {

                  View view =
                      new View(this);

                  root.addView(
                      view,
                      new LinearLayout.LayoutParams(
                          1,
                          height
                      )
                  );

              }

              private void enableImmersive() {

                  Window window =
                      getWindow();

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  window.getDecorView().setSystemUiVisibility(

                      View.SYSTEM_UI_FLAG_FULLSCREEN

                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION

                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                  );

              }

          }
          EOF

      # ------------------------------------------------------------
      # 5. CREATE ~590MB OF REAL APP ASSETS
      #
      # These are generated binary asset files, not executable code.
      # They are packaged inside the application.
      # ------------------------------------------------------------
      - name: Generate Q-Launcher asset library
        shell: bash
        run: |

          mkdir -p app/src/main/assets/qlauncher_assets

          python3 <<'PY'
          import os

          directory = "app/src/main/assets/qlauncher_assets"

          # Target is intentionally below 590 MiB because APK
          # packaging adds metadata and other application files.
          #
          # The generated files contain deterministic binary data
          # and are treated as application assets.

          TARGET = 575 * 1024 * 1024

          CHUNK = 8 * 1024 * 1024

          pattern = bytes(
              ((i * 37 + 91) & 255)
              for i in range(1024 * 1024)
          )

          created = 0
          index = 0

          while created < TARGET:

              remaining = TARGET - created

              size = min(CHUNK, remaining)

              path = os.path.join(
                  directory,
                  f"asset_{index:03d}.qasset"
              )

              with open(path, "wb") as f:

                  full = size // len(pattern)

                  remainder = size % len(pattern)

                  for _ in range(full):
                      f.write(pattern)

                  if remainder:
                      f.write(pattern[:remainder])

              created += size

              index += 1

          print(
              f"Generated {created / (1024**2):.2f} MiB "
              f"of Q-Launcher assets."
          )
          PY

          du -sh app/src/main/assets/qlauncher_assets

      # ------------------------------------------------------------
      # 6. GRADLE WRAPPER
      # ------------------------------------------------------------
      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      # ------------------------------------------------------------
      # 7. FIX GRADLE PERMISSION
      # ------------------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x gradlew

      # ------------------------------------------------------------
      # 8. BUILD APK
      # ------------------------------------------------------------
      - name: Build Q-Launcher APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ------------------------------------------------------------
      # 9. SHOW ACTUAL APK SIZE
      # ------------------------------------------------------------
      - name: Measure APK
        shell: bash
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$APK")

          SIZE_MB=$(python3 - <<PY
          size = $SIZE_BYTES
          print(f"{size / (1024*1024):.2f}")
          PY
          )

          SIZE_GB=$(python3 - <<PY
          size = $SIZE_BYTES
          print(f"{size / (1024*1024*1024):.3f}")
          PY
          )

          echo ""
          echo "=========================================="
          echo "          Q-LAUNCHER BUILD"
          echo "=========================================="
          echo "APK size: ${SIZE_MB} MiB"
          echo "APK size: ${SIZE_GB} GiB"
          echo "=========================================="
          echo ""

          echo "APK_SIZE_MB=${SIZE_MB}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 10. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload Q-Launcher APK
        uses: actions/upload-artifact@v4

        with:

          name: Q-Launcher-${{ env.APK_SIZE_MB }}MB

          path: app/build/outputs/apk/debug/app-debug.apk

          retention-days: 30